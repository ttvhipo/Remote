<!DOCTYPE html>
<html lang="en" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Mistral AI Chat</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/9.1.6/marked.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/highlight.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/styles/github-dark.min.css">
    <style>
        :root {
            color-scheme: light dark;
        }

        :root[data-theme="light"] {
            --primary-color: #7C3AED;
            --secondary-color: #9F7AEA;
            --background-color: #F3F4F6;
            --chat-background: #FFFFFF;
            --user-message-bg: #7C3AED15;
            --assistant-message-bg: #F9FAFB;
            --text-color: #1F2937;
            --border-color: #E5E7EB;
            --input-bg: #F3F4F6;
            --hover-color: #F3F4F6;
        }

        :root[data-theme="dark"] {
            --primary-color: #9F7AEA;
            --secondary-color: #7C3AED;
            --background-color: #1F2937;
            --chat-background: #111827;
            --user-message-bg: #7C3AED30;
            --assistant-message-bg: #374151;
            --text-color: #F9FAFB;
            --border-color: #374151;
            --input-bg: #374151;
            --hover-color: #2D3748;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--background-color);
            color: var(--text-color);
            line-height: 1.6;
            transition: background-color 0.3s, color 0.3s;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 10px;
            display: flex;
            gap: 20px;
            height: 100vh;
        }

        .sidebar {
            width: 260px;
            background: var(--chat-background);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s;
            position: fixed;
            top: 10px;
            bottom: 10px;
            z-index: 1000;
            transform: translateX(-280px);
        }

        .sidebar.open {
            transform: translateX(0);
        }

        .sidebar-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 999;
        }

        .sidebar-overlay.open {
            display: block;
        }

        .main-content {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            background: var(--chat-background);
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            margin-left: 0;
            transition: margin-left 0.3s;
        }

        @media (min-width: 768px) {
            .container {
                padding: 20px;
            }
            
            .sidebar {
                position: static;
                transform: none;
            }

            .sidebar-overlay {
                display: none !important;
            }

            .main-content {
                margin-left: 280px;
            }

            .menu-button {
                display: none !important;
            }
        }

        .settings-section {
            margin-bottom: 20px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 20px;
        }

        .settings-section:last-child {
            border-bottom: none;
        }

        .settings-title {
            font-size: 0.9em;
            text-transform: uppercase;
            color: var(--primary-color);
            margin-bottom: 10px;
        }

        .theme-switch {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 15px;
        }

        .switch {
            position: relative;
            display: inline-block;
            width: 48px;
            height: 24px;
        }

        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: var(--input-bg);
            transition: .4s;
            border-radius: 24px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 20px;
            width: 20px;
            left: 2px;
            bottom: 2px;
            background-color: var(--primary-color);
            transition: .4s;
            border-radius: 50%;
        }

        input:checked + .slider:before {
            transform: translateX(24px);
        }

        .chat-header {
            padding: 20px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .menu-button {
            background: none;
            border: none;
            color: var(--text-color);
            font-size: 24px;
            cursor: pointer;
            padding: 5px;
        }

        .chat-messages {
            flex-grow: 1;
            overflow-y: auto;
            padding: 20px;
        }

        .message {
            max-width: 85%;
            margin-bottom: 20px;
            padding: 15px;
            border-radius: 12px;
            animation: fadeIn 0.3s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .user-message {
            background: var(--user-message-bg);
            margin-left: auto;
            color: var(--text-color);
        }

        .assistant-message {
            background: var(--assistant-message-bg);
            margin-right: auto;
        }

        .input-container {
            padding: 20px;
            border-top: 1px solid var(--border-color);
        }

        .input-wrapper {
            display: flex;
            gap: 10px;
            background: var(--input-bg);
            padding: 10px;
            border-radius: 12px;
        }

        textarea {
            flex-grow: 1;
            padding: 10px;
            border: none;
            background: transparent;
            resize: none;
            font-family: inherit;
            font-size: 14px;
            outline: none;
            color: var(--text-color);
            min-height: 24px;
            max-height: 150px;
        }

        button {
            padding: 10px 20px;
            background: var(--primary-color);
            color: white;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: background 0.3s;
            font-weight: 500;
        }

        button:hover {
            background: var(--secondary-color);
        }

        button:disabled {
            background: var(--input-bg);
            cursor: not-allowed;
        }

        select, input[type="text"] {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            background: var(--input-bg);
            color: var(--text-color);
            margin-bottom: 10px;
            cursor: pointer;
        }

        .persona-input {
            margin-bottom: 15px;
        }

        .error-message {
            background: #FEE2E2;
            color: #DC2626;
            padding: 10px;
            border-radius: 8px;
            margin: 10px 0;
            display: none;
        }

        pre {
            background: var(--input-bg);
            padding: 15px;
            border-radius: 8px;
            overflow-x: auto;
            margin: 10px 0;
        }

        code {
            font-family: 'Fira Code', monospace;
            font-size: 14px;
        }

        .typing-indicator {
            display: none;
            padding: 15px;
            background: var(--assistant-message-bg);
            border-radius: 12px;
            margin-bottom: 20px;
            width: fit-content;
        }

        .typing-indicator span {
            display: inline-block;
            width: 8px;
            height: 8px;
            background: var(--primary-color);
            border-radius: 50%;
            margin-right: 5px;
            animation: typing 1s infinite;
        }

        @keyframes typing {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-5px); }
        }

        .file-preview {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 10px;
        }

        .preview-image {
            width: 100px;
            height: 100px;
            object-fit: cover;
            border-radius: 8px;
        }

        .attachment-button {
            background: transparent;
            color: var(--text-color);
            padding: 10px;
        }

        .attachment-button:hover {
            background: var(--hover-color);
        }
    </style>
</head>

                <input type="file" id="fileInput" accept="image/*" style="display: none" multiple>
            </div>
        </main>
    </div>
