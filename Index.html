<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mistral AI Chat</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/9.1.6/marked.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        :root {
            --primary-color: #6366f1;
            --primary-hover: #4f46e5;
            --bg-color: #f9fafb;
            --chat-bg: #ffffff;
            --text-color: #1f2937;
            --border-color: #e5e7eb;
            --message-user-bg: #ede9fe;
            --message-ai-bg: #f3f4f6;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        [data-theme="dark"] {
            --primary-color: #818cf8;
            --primary-hover: #6366f1;
            --bg-color: #111827;
            --chat-bg: #1f2937;
            --text-color: #f9fafb;
            --border-color: #374151;
            --message-user-bg: #374151;
            --message-ai-bg: #272f3d;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg-color);
            color: var(--text-color);
            line-height: 1.5;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .header {
            background: var(--chat-bg);
            padding: 1rem;
            box-shadow: var(--shadow);
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 10;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 {
            font-size: 1.5rem;
            color: var(--primary-color);
            max-width: 800px;
            margin: 0 auto;
        }

        .theme-toggle {
            background: none;
            border: none;
            padding: 0.5rem;
            cursor: pointer;
            color: var(--text-color);
            font-size: 1.5rem;
        }

        .chat-container {
            max-width: 800px;
            margin: 5rem auto 0;
            padding: 1rem;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            gap: 1rem;
            height: calc(100vh - 10rem);
        }

        .messages {
            flex-grow: 1;
            overflow-y: auto;
            padding: 1rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .message {
            padding: 1rem;
            border-radius: 1rem;
            max-width: 80%;
            animation: fadeIn 0.3s ease;
            position: relative;
            transform-origin: left bottom;
        }

        .message.user {
            background: var(--message-user-bg);
            margin-left: auto;
            border-bottom-right-radius: 0.25rem;
            transform-origin: right bottom;
        }

        .message.ai {
            background: var(--message-ai-bg);
            margin-right: auto;
            border-bottom-left-radius: 0.25rem;
        }

        @keyframes fadeIn {
            from { 
                opacity: 0; 
                transform: translateY(20px) scale(0.95); 
            }
            to { 
                opacity: 1; 
                transform: translateY(0) scale(1); 
            }
        }

        @keyframes slideIn {
            from {
                transform: translateX(-100%);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        .input-area {
            background: var(--chat-bg);
            padding: 1rem;
            border-radius: 1rem;
            box-shadow: var(--shadow);
            margin-top: auto;
            position: relative;
            animation: slideUp 0.5s ease;
        }

        @keyframes slideUp {
            from { transform: translateY(100%); }
            to { transform: translateY(0); }
        }

        .input-container {
            display: flex;
            gap: 0.5rem;
            align-items: flex-end;
        }

        textarea {
            flex-grow: 1;
            padding: 0.75rem;
            border: 2px solid var(--border-color);
            border-radius: 0.5rem;
            resize: none;
            font-family: inherit;
            font-size: 1rem;
            line-height: 1.5;
            min-height: 2.5rem;
            max-height: 150px;
            transition: all 0.3s ease;
            background: var(--chat-bg);
            color: var(--text-color);
        }

        textarea:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2);
        }

        button {
            padding: 0.75rem 1.5rem;
            background: var(--primary-color);
            color: white;
            border: none;
            border-radius: 0.5rem;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.3s ease;
            height: 2.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        button:hover {
            background: var(--primary-hover);
            transform: translateY(-1px);
        }

        button:active {
            transform: translateY(1px);
        }

        .typing-indicator {
            display: none;
            padding: 1rem;
            background: var(--message-ai-bg);
            border-radius: 1rem;
            width: fit-content;
            animation: fadeIn 0.3s ease;
        }

        .typing-indicator span {
            width: 8px;
            height: 8px;
            background: var(--primary-color);
            border-radius: 50%;
            display: inline-block;
            margin-right: 3px;
            animation: bounce 1s infinite;
        }

        .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
        .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-5px); }
        }

        .error {
            background: #dc2626;
            color: white;
            padding: 1rem;
            border-radius: 0.5rem;
            margin: 1rem 0;
            display: none;
            animation: shake 0.5s ease;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }

        @media (max-width: 768px) {
            .chat-container {
                padding: 0.5rem;
            }
            
            .message {
                max-width: 90%;
            }

            .header h1 {
                font-size: 1.25rem;
                padding: 0 1rem;
            }
        }
    </style>
</head>
<body>
    <header class="header">
        <h1>Mistral AI Chat</h1>
        <button class="theme-toggle" id="themeToggle">🌙</button>
    </header>

    <main class="chat-container">
        <div class="messages" id="messages">
            <div class="typing-indicator" id="typingIndicator">
                <span></span>
                <span></span>
                <span></span>
            </div>
        </div>

        <div class="error" id="error"></div>

        <div class="input-area">
            <div class="input-container">
                <textarea 
                    id="userInput" 
                    placeholder="Type your message here... (Press Enter to send)"
                    rows="1"
                ></textarea>
                <button id="sendButton">Send</button>
            </div>
        </div>
    </main>

    <script>
        const API_KEY = 'HqpkZimUXhgxqGKLk8OfD7TBag5Bmlbu';
        const messagesContainer = document.getElementById('messages');
        const userInput = document.getElementById('userInput');
        const sendButton = document.getElementById('sendButton');
        const errorDiv = document.getElementById('error');
        const typingIndicator = document.getElementById('typingIndicator');
        const themeToggle = document.getElementById('themeToggle');

        // Theme handling
        let isDarkMode = window.matchMedia('(prefers-color-scheme: dark)').matches;
        
        function toggleTheme() {
            isDarkMode = !isDarkMode;
            document.documentElement.setAttribute('data-theme', isDarkMode ? 'dark' : 'light');
            themeToggle.textContent = isDarkMode ? '☀️' : '🌙';
        }

        // Set initial theme
        document.documentElement.setAttribute('data-theme', isDarkMode ? 'dark' : 'light');
        themeToggle.textContent = isDarkMode ? '☀️' : '🌙';
        themeToggle.addEventListener('click', toggleTheme);

        // Auto-resize textarea
        userInput.addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = Math.min(this.scrollHeight, 150) + 'px';
        });

        // Chat history
        let chatHistory = [];

        // AI Persona configuration
        const aiPersona = {
            name: "Mistral",
            greeting: "Hello! I'm Mistral, your AI assistant. I'm here to help you with any questions or tasks you might have. I'm knowledgeable about various topics and can assist with analysis, coding, writing, and more. How can I help you today?",
            personality: {
                friendly: true,
                professional: true,
                helpful: true,
                knowledgeable: true
            }
        };

        // Send message function
        async function sendMessage() {
            const message = userInput.value.trim();
            if (!message) return;

            // Clear error
            errorDiv.style.display = 'none';

            // Add user message
            appendMessage('user', message);
            chatHistory.push({ role: 'user', content: message });

            // Clear input and reset height
            userInput.value = '';
            userInput.style.height = 'auto';

            // Disable input while processing
            userInput.disabled = true;
            sendButton.disabled = true;
            typingIndicator.style.display = 'block';

            try {
                const response = await fetch('https://api.mistral.ai/v1/chat/completions', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${API_KEY}`
                    },
                    body: JSON.stringify({
                        model: 'mistral-tiny',
                        messages: [
                            {
                                role: 'system',
                                content: `You are ${aiPersona.name}, an AI assistant with the following personality traits: ${Object.entries(aiPersona.personality).filter(([_, value]) => value).map(([trait]) => trait).join(', ')}. Maintain a consistent, helpful, and friendly tone while providing accurate and thoughtful responses.`
                            },
                            ...chatHistory
                        ]
                    })
                });

                if (!response.ok) {
                    throw new Error(`API Error: ${response.status} - ${response.statusText}`);
                }

                const data = await response.json();
                const aiResponse = data.choices[0].message.content;
                chatHistory.push({ role: 'assistant', content: aiResponse });
                appendMessage('ai', aiResponse);
            } catch (error) {
                console.error('Error:', error);
                errorDiv.textContent = `An error occurred: ${error.message}`;
                errorDiv.style.display = 'block';
                
                // Remove the failed message from chat history
                chatHistory.pop();
            } finally {
                // Re-enable input
                userInput.disabled = false;
                sendButton.disabled = false;
                typingIndicator.style.display = 'none';
                userInput.focus();
            }
        }

        // Append message to chat
        function appendMessage(role, content) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${role}`;
            messageDiv.innerHTML = marked.parse(content);
            messagesContainer.insertBefore(messageDiv, typingIndicator);
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }

        // Handle enter key
        userInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        // Handle button click
        sendButton.addEventListener('click', sendMessage);

        // Add welcome message
        appendMessage('ai', aiPersona.greeting);
    </script>
</body>
</html>
